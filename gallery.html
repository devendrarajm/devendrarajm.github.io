    <style>

        /* Main Gallery Layout */

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            width: 100%;
            margin: 25px auto;
        }

        /* Individual Image Container */

        .gallery-item {
            width: 100%;
            height: 165px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #f7f7f7;
            border: 1px solid #eeeeee;
            border-radius: 9px;
            padding: 4px;
            box-sizing: border-box;
            transition: transform 0.25s ease,
                        box-shadow 0.25s ease;
        }

        /* Images */

        .gallery-item img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
        }

        /* Desktop Hover Effect */

        @media (hover: hover) {

            .gallery-item:hover {
                transform: translateY(-3px);
                box-shadow: 0 5px 14px rgba(0, 0, 0, 0.13);
            }

        }

        /* Smaller Desktop and Tablets */

        @media (max-width: 1000px) {

            .gallery {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 10px;
            }

            .gallery-item {
                height: 155px;
            }

        }

        /* Mobile Devices */

        @media (max-width: 600px) {

            .gallery {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 7px;
                margin: 18px auto;
            }

            .gallery-item {
                height: 125px;
                padding: 3px;
                border-radius: 6px;
            }

        }

        /* Very Small Mobile Screens */

        @media (max-width: 380px) {

            .gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
            }

            .gallery-item {
                height: 140px;
            }

        }

    </style>

</head>
